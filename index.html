<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>🛠️ Mantenimiento</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7fb;
  color:#172033;
  font-family:Arial,Helvetica,sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
}

.loginbox{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.loginbox h1{
  margin:0 0 8px;
  font-size:30px;
}

.loginbox p{
  color:#64748b;
  margin:0 0 24px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.form input{
  width:100%;
  padding:15px;
  border:1px solid #d7deea;
  border-radius:12px;
  outline:none;
}

.form input:focus{
  border-color:#2563eb;
}

.btn{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-weight:bold;
  color:white;
  background:#2563eb;
}

.btn:hover{
  opacity:.9;
}

.btn.secondary{
  background:#e8eef8;
  color:#1e3a8a;
}

.mensaje{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#f1f5f9;
  color:#475569;
  font-size:14px;
}

/* APP */

#app{
  min-height:100vh;
}

header{
  background:#0f172a;
  color:white;
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.bar{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.usuario{
  font-size:13px;
  color:#cbd5e1;
}

.wrap{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* ESTADISTICAS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 4px 15px rgba(15,23,42,.06);
}

.stat b{
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

.stat span{
  color:#64748b;
  font-size:14px;
}

/* SECCION */

.section{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 15px rgba(15,23,42,.06);
}

.sectionhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.sectionhead h2{
  margin:0;
  font-size:21px;
}

.add{
  border:0;
  background:#2563eb;
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
}

.tools{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tools input{
  flex:1;
  padding:12px;
  border:1px solid #d7deea;
  border-radius:10px;
}

.filters{
  display:flex;
  gap:8px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.filter{
  border:0;
  background:#e9eef6;
  color:#334155;
  padding:9px 13px;
  border-radius:20px;
}

.filter.active{
  background:#2563eb;
  color:white;
}

/* TRABAJOS */

.job{
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:16px;
  margin-bottom:12px;
  background:#fff;
}

.jt{
  font-size:18px;
  font-weight:bold;
  margin-bottom:7px;
}

.meta{
  color:#64748b;
  font-size:14px;
  margin-top:7px;
  line-height:1.45;
}

.badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badge{
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.red{
  background:#fee2e2;
  color:#b91c1c;
}

.yellow{
  background:#fef3c7;
  color:#92400e;
}

.green{
  background:#dcfce7;
  color:#166534;
}

.blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.orange{
  background:#ffedd5;
  color:#c2410c;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.small{
  border:0;
  padding:9px 12px;
  border-radius:9px;
  background:#e8eef8;
  color:#1e3a8a;
  font-weight:bold;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:50;
}

.modal.on{
  display:flex;
}

.modalbox{
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  padding:22px;
}

.modalbox h2{
  margin-top:0;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:12px;
  border:1px solid #d7deea;
  border-radius:10px;
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.material{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.material input[type="text"]{
  flex:1;
}

.material label{
  white-space:nowrap;
  font-size:13px;
}

.modalactions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}

/* RESPONSIVE */

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .bar{
    align-items:flex-start;
  }

  .usuario{
    display:none;
  }
}

@media(max-width:550px){
  .wrap{
    padding:12px;
  }

  .stats{
    gap:8px;
  }

  .stat{
    padding:13px;
  }

  .stat b{
    font-size:23px;
  }

  .section{
    padding:13px;
  }

  .sectionhead{
    align-items:flex-start;
  }

  .tools{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="login">

  <div class="loginbox">

    <h1>🛠️ Mantenimiento</h1>

    <p>Ingresá para ver y administrar los trabajos.</p>

    <div class="form">

      <input
        id="user"
        type="email"
        placeholder="📧 Email"
        autocomplete="email"
      >

      <input
        id="pass"
        type="password"
        placeholder="🔐 Contraseña"
        autocomplete="current-password"
      >

      <button class="btn" onclick="entrar()">
        🔑 Ingresar
      </button>

      <button class="btn secondary" onclick="registrar()">
        👤 Crear usuario
      </button>

    </div>

    <div id="loginmsg" class="mensaje">
      Los usuarios quedan guardados online en Supabase.
    </div>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<header>

  <div class="bar">

    <div class="logo">
      🛠️ Mantenimiento
    </div>

    <div class="usuario">
      <span id="usuarioNombre"></span>
      ·
      <button
        onclick="salir()"
        style="background:none;border:0;color:#93c5fd;font-weight:bold;"
      >
        Salir
      </button>
    </div>

  </div>

</header>


<div class="wrap">

  <!-- ESTADISTICAS -->

  <div class="stats">

    <div class="stat">
      <b id="s1">0</b>
      <span>🔴 Urgentes</span>
    </div>

    <div class="stat">
      <b id="s2">0</b>
      <span>⏳ Pendientes</span>
    </div>

    <div class="stat">
      <b id="s3">0</b>
      <span>⚠️ Faltan materiales</span>
    </div>

    <div class="stat">
      <b id="s4">0</b>
      <span>✅ Terminados</span>
    </div>

  </div>


  <!-- TRABAJOS -->

  <div class="section">

    <div class="sectionhead">

      <h2>📋 Próximos trabajos</h2>

      <button class="add" onclick="nuevo()">
        ➕ Nuevo
      </button>

    </div>

    <div class="tools">

      <input
        id="buscar"
        placeholder="🔎 Buscar trabajo, descripción o ubicación..."
        oninput="dibujar()"
      >

    </div>

    <div class="filters">

      <button
        class="filter active"
        id="fTodos"
        onclick="filtrar('todos')"
      >
        Todos
      </button>

      <button
        class="filter"
        id="fPend"
        onclick="filtrar('pend')"
      >
        ⏳ Pendientes
      </button>

      <button
        class="filter"
        id="fFalt"
        onclick="filtrar('falt')"
      >
        ⚠️ Falta material
      </button>

    </div>

    <div id="lista"></div>

  </div>

</div>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

  <div class="modalbox">

    <h2 id="titulo">
      ➕ Nuevo trabajo
    </h2>

    <div class="field">
      <label>Trabajo</label>
      <input
        id="t"
        placeholder="Ej: Revisar aire acondicionado"
      >
    </div>

    <div class="field">
      <label>Descripción</label>
      <textarea
        id="d"
        placeholder="Descripción del trabajo..."
      ></textarea>
    </div>

    <div class="field">
      <label>Ubicación / Equipo</label>
      <input
        id="e"
        placeholder="Ej: Sala Vegas - Aire 1"
      >
    </div>

    <div class="field">
      <label>Fecha programada</label>
      <input id="f" type="date">
    </div>

    <div class="field">
      <label>Prioridad</label>

      <select id="u">
        <option value="Alta">🔴 Alta</option>
        <option value="Media" selected>🟡 Media</option>
        <option value="Baja">🟢 Baja</option>
      </select>

    </div>

    <div class="field">

      <label>Estado</label>

      <select id="st">
        <option value="Pendiente">⏳ Pendiente</option>
        <option value="En proceso">🔧 En proceso</option>
        <option value="Terminado">✅ Terminado</option>
      </select>

    </div>


    <div class="field">

      <label>📦 Materiales</label>

      <div id="ms"></div>

      <button
        type="button"
        class="small"
        onclick="material()"
      >
        ➕ Agregar material
      </button>

    </div>


    <div class="field">

      <label>Observaciones</label>

      <textarea
        id="obs"
        placeholder="Observaciones..."
      ></textarea>

    </div>


    <div class="modalactions">

      <button
        class="small"
        onclick="cerrar()"
      >
        Cancelar
      </button>

      <button
        class="add"
        onclick="guardar()"
      >
        💾 Guardar
      </button>

    </div>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   CONEXION SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://ujyrggzrcnbddkbvzvjv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oerDQnQCB89-BLPi7-VW2g_gs5TQmUW";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   VARIABLES
   ========================================================= */

let perfil = null;
let datos = [];
let edit = null;
let modo = "todos";


/* =========================================================
   ELEMENTOS
   ========================================================= */

const login = document.getElementById("login");
const app = document.getElementById("app");
const loginmsg = document.getElementById("loginmsg");

const usuarioNombre =
  document.getElementById("usuarioNombre");

const lista =
  document.getElementById("lista");

const buscar =
  document.getElementById("buscar");

const modal =
  document.getElementById("modal");

const titulo =
  document.getElementById("titulo");

const t =
  document.getElementById("t");

const d =
  document.getElementById("d");

const e =
  document.getElementById("e");

const f =
  document.getElementById("f");

const u =
  document.getElementById("u");

const st =
  document.getElementById("st");

const obs =
  document.getElementById("obs");

const ms =
  document.getElementById("ms");


/* =========================================================
   MENSAJE
   ========================================================= */

function msg(text){

  loginmsg.textContent = text;

}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


/* =========================================================
   LOGIN
   ========================================================= */

async function entrar(){

  const email =
    document.getElementById("user").value.trim();

  const password =
    document.getElementById("pass").value;

  if(!email || !password){

    msg("Completá email y contraseña.");

    return;
  }

  msg("🔄 Ingresando...");

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    console.error(error);

    msg("❌ "+error.message);

    return;
  }

  if(data.session){

    await cargarUsuario();

  }

}


/* =========================================================
   REGISTRAR
   ========================================================= */

async function registrar(){

  const email =
    document.getElementById("user").value.trim();

  const password =
    document.getElementById("pass").value;

  if(!email || !password){

    msg("Escribí email y contraseña para crear el usuario.");

    return;
  }

  if(password.length < 6){

    msg("La contraseña debe tener al menos 6 caracteres.");

    return;
  }

  msg("🔄 Creando usuario...");

  const {data,error} =
    await db.auth.signUp({
      email,
      password
    });

  if(error){

    console.error(error);

    msg("❌ "+error.message);

    return;
  }

  /*
   Si Supabase tiene confirmación de email activada,
   puede que tengas que confirmar el correo antes
   de poder entrar.
  */

  if(data.session){

    await cargarUsuario();

  }else{

    msg(
      "✅ Usuario creado. Revisá tu email para confirmar la cuenta y después ingresá."
    );

  }

}


/* =========================================================
   CARGAR USUARIO
   ========================================================= */

async function cargarUsuario(){

  const {
    data:{user},
    error
  } = await db.auth.getUser();

  if(error || !user){

    mostrarLogin();

    return;
  }

  /*
   Buscamos el perfil.
  */

  let {data:pf,error:perror} =
    await db
      .from("perfiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  if(perror){

    console.error(perror);

    /*
     Aunque todavía no exista el perfil,
     dejamos entrar a la aplicación.
    */

    perfil = {
      id:user.id,
      nombre:user.email,
      email:user.email,
      rol:"tecnico"
    };

  }else if(!pf){

    /*
     Intentamos crear el perfil.
     Si RLS no lo permite, igual seguimos.
    */

    const nuevoPerfil = {
      id:user.id,
      nombre:user.email.split("@")[0],
      email:user.email,
      rol:"tecnico"
    };

    const resultado =
      await db
        .from("perfiles")
        .insert(nuevoPerfil)
        .select()
        .maybeSingle();

    if(resultado.error){

      console.warn(
        "No se pudo crear perfil:",
        resultado.error
      );

      perfil = nuevoPerfil;

    }else{

      perfil = resultado.data || nuevoPerfil;

    }

  }else{

    perfil = pf;

  }

  usuarioNombre.textContent =
    perfil.nombre || perfil.email || user.email;

  mostrarApp();

  await cargarTrabajos();

}


/* =========================================================
   MOSTRAR APP
   ========================================================= */

function mostrarApp(){

  login.classList.add("hidden");
  app.classList.remove("hidden");

}


/* =========================================================
   MOSTRAR LOGIN
   ========================================================= */

function mostrarLogin(){

  app.classList.add("hidden");
  login.classList.remove("hidden");

}


/* =========================================================
   SALIR
   ========================================================= */

async function salir(){

  await db.auth.signOut();

  perfil = null;
  datos = [];

  mostrarLogin();

}


/* =========================================================
   CARGAR TRABAJOS
   ========================================================= */

async function cargarTrabajos(){

  lista.innerHTML =
    "<p style='color:#64748b'>🔄 Cargando trabajos...</p>";

  const {data,error} =
    await db
      .from("trabajos")
      .select("*")
      .order("fecha_programada",{ascending:true})
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    lista.innerHTML =
      `<p style="color:#b91c1c">
        ❌ No se pudieron cargar los trabajos.<br>
        ${esc(error.message)}
      </p>`;

    return;
  }

  datos = (data || []).map(x => ({

    id:x.id,

    t:x.t || x.titulo || "",

    d:x.d || x.descripcion || "",

    e:x.e || x.ubicacion || "",

    f:x.f || x.fecha_programada || "",

    u:x.u || x.prioridad || "Media",

    st:x.st || x.estado || "Pendiente",

    obs:x.obs || x.observaciones || "",

    m:Array.isArray(x.materiales)
      ? x.materiales
      : []

  }));

  dibujar();

}


/* =========================================================
   DIBUJAR
   ========================================================= */

function dibujar(){

  const q =
    (buscar.value || "").toLowerCase();

  document.getElementById("s1").textContent =
    datos.filter(
      x =>
        x.u === "Alta" &&
        x.st !== "Terminado"
    ).length;

  document.getElementById("s2").textContent =
    datos.filter(
      x =>
        x.st === "Pendiente"
    ).length;

  document.getElementById("s3").textContent =
    datos.filter(
      x =>
        x.m.some(m => !m[1]) &&
        x.st !== "Terminado"
    ).length;

  document.getElementById("s4").textContent =
    datos.filter(
      x =>
        x.st === "Terminado"
    ).length;


  let a = datos.filter(x => {

    let filtro =
      modo === "todos" ||

      (
        modo === "pend" &&
        x.st !== "Terminado"
      ) ||

      (
        modo === "falt" &&
        x.m.some(m => !m[1])
      );

    return filtro &&
      (
        x.t +
        x.d +
        x.e +
        x.obs
      )
      .toLowerCase()
      .includes(q);

  });


  if(!a.length){

    lista.innerHTML =
      `<div style="
        padding:30px;
        text-align:center;
        color:#64748b;
      ">
        📭 No hay trabajos para mostrar.
      </div>`;

    return;
  }


  lista.innerHTML = a.map(x => {

    const materiales =
      x.m || [];

    const faltan =
      materiales.some(m => !m[1]);


    return `

      <div class="job">

        <div class="jt">
          ${esc(x.t)}
        </div>

        <div class="meta">
          🏭 ${esc(x.e || "Sin ubicación")}
          ·
          📅 ${esc(x.f || "Sin fecha")}
        </div>

        <div class="badges">

          <span class="badge ${
            x.u === "Alta"
              ? "red"
              : x.u === "Media"
                ? "yellow"
                : "green"
          }">

            ${
              x.u === "Alta"
                ? "🔴"
                : x.u === "Media"
                  ? "🟡"
                  : "🟢"
            }

            ${esc(x.u)}

          </span>


          <span class="badge blue">

            🔧 ${esc(x.st)}

          </span>


          ${
            faltan

              ? `<span class="badge orange">
                  ⚠️ Falta material
                </span>`

              : materiales.length

                ? `<span class="badge green">
                    📦 Completo
                  </span>`

                : ""
          }

        </div>


        ${
          x.d
            ? `<div class="meta">
                ${esc(x.d)}
              </div>`
            : ""
        }


        ${
          materiales.length

            ? `<div class="meta">
                ${materiales
                  .map(
                    m =>
                      (m[1] ? "✅ " : "❌ ") +
                      esc(m[0])
                  )
                  .join(" · ")}
              </div>`

            : ""
        }


        ${
          x.obs
            ? `<div class="meta">
                📝 ${esc(x.obs)}
              </div>`
            : ""
        }


        <div class="actions">

          <button
            class="small"
            onclick="editar('${x.id}')"
          >
            ✏️ Editar
          </button>

          <button
            class="small"
            onclick="avanzar('${x.id}')"
          >
            ▶️ Estado
          </button>

        </div>

      </div>

    `;

  }).join("");

}


/* =========================================================
   FILTROS
   ========================================================= */

function filtrar(nuevoModo){

  modo = nuevoModo;

  document
    .querySelectorAll(".filter")
    .forEach(x =>
      x.classList.remove("active")
    );

  if(nuevoModo === "todos")
    document
      .getElementById("fTodos")
      .classList.add("active");

  if(nuevoModo === "pend")
    document
      .getElementById("fPend")
      .classList.add("active");

  if(nuevoModo === "falt")
    document
      .getElementById("fFalt")
      .classList.add("active");

  dibujar();

}


/* =========================================================
   NUEVO
   ========================================================= */

function nuevo(){

  editar(null);

}


/* =========================================================
   EDITAR
   ========================================================= */

function editar(id){

  edit = id;

  let x;

  if(id){

    x = datos.find(
      y => String(y.id) === String(id)
    );

    if(!x){

      alert("No se encontró el trabajo.");

      return;
    }

  }else{

    x = {

      t:"",
      d:"",
      e:"",
      f:new Date()
        .toISOString()
        .slice(0,10),

      u:"Media",

      st:"Pendiente",

      obs:"",

      m:[]

    };

  }


  titulo.textContent =
    id
      ? "✏️ Editar trabajo"
      : "➕ Nuevo trabajo";


  t.value = x.t || "";
  d.value = x.d || "";
  e.value = x.e || "";
  f.value = x.f || "";
  u.value = x.u || "Media";
  st.value = x.st || "Pendiente";
  obs.value = x.obs || "";


  ms.innerHTML = "";

  (x.m || []).forEach(material);


  modal.classList.add("on");

}


/* =========================================================
   MATERIAL
   ========================================================= */

function material(v=["",0]){

  const z =
    document.createElement("div");

  z.className = "material";


  z.innerHTML = `

    <input
      type="text"
      value="${esc(v[0])}"
      placeholder="Material"
    >

    <label>
      <input
        type="checkbox"
        ${v[1] ? "checked" : ""}
      >
      ✅
    </label>

    <button
      type="button"
      class="small"
      onclick="this.parentElement.remove()"
    >
      🗑️
    </button>

  `;


  ms.appendChild(z);

}


/* =========================================================
   GUARDAR
   ========================================================= */

async function guardar(){

  if(!perfil){

    alert("No hay usuario autenticado.");

    return;
  }


  if(!t.value.trim()){

    alert("Escribí el trabajo.");

    return;
  }


  const materiales =
    [...ms.children]
      .map(x => {

        const input =
          x.querySelector(
            'input[type="text"]'
          );

        const check =
          x.querySelector(
            'input[type="checkbox"]'
          );

        return [

          input
            ? input.value.trim()
            : "",

          check && check.checked
            ? 1
            : 0

        ];

      })
      .filter(x => x[0]);


  /*
   IMPORTANTE:
   Tu tabla actual tiene estos nombres:

   titulo
   descripcion
   ubicacion
   prioridad
   estado
   fecha_programada
   observaciones
   creado_por

   Por eso usamos exactamente esos nombres.
  */

  const payload = {

    titulo:
      t.value.trim(),

    descripcion:
      d.value.trim() || null,

    ubicacion:
      e.value.trim() || null,

    prioridad:
      u.value,

    estado:
      st.value,

    fecha_programada:
      f.value || null,

    observaciones:
      construirObservaciones(
        obs.value,
        materiales
      )

  };


  let error;


  if(edit){

    const resultado =
      await db
        .from("trabajos")
        .update(payload)
        .eq("id",edit);

    error = resultado.error;

  }else{

    payload.creado_por =
      perfil.id;

    const resultado =
      await db
        .from("trabajos")
        .insert(payload);

    error = resultado.error;

  }


  if(error){

    console.error(error);

    alert(
      "❌ No se pudo guardar:\n\n" +
      error.message
    );

    return;
  }


  cerrar();

  await cargarTrabajos();

}


/* =========================================================
   GUARDAR MATERIALES DENTRO DE OBSERVACIONES
   ========================================================= */

function construirObservaciones(texto, materiales){

  let base =
    (texto || "").trim();


  /*
   Como tu tabla actual no tiene una columna
   "materiales", los guardamos dentro de
   observaciones de forma especial.

   Más adelante podemos agregar una columna
   JSONB y dejarlo todavía mejor.
  */

  if(materiales.length){

    const bloque =
      "\n\n[MATERIALES]\n" +
      materiales
        .map(
          m =>
            (m[1] ? "✅ " : "❌ ") +
            m[0]
        )
        .join("\n") +
      "\n[/MATERIALES]";

    return base + bloque;

  }


  return base || null;

}


/* =========================================================
   AVANZAR ESTADO
   ========================================================= */

async function avanzar(id){

  const x =
    datos.find(
      y => String(y.id) === String(id)
    );

  if(!x) return;


  let nuevoEstado;


  if(x.st === "Pendiente"){

    nuevoEstado = "En proceso";

  }else if(x.st === "En proceso"){

    nuevoEstado = "Terminado";

  }else{

    nuevoEstado = "Pendiente";

  }


  const {error} =
    await db
      .from("trabajos")
      .update({

        estado:nuevoEstado,

        fecha_realizado:
          nuevoEstado === "Terminado"
            ? new Date().toISOString()
            : null

      })
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "❌ No se pudo cambiar el estado:\n\n" +
      error.message
    );

    return;
  }


  await cargarTrabajos();

}


/* =========================================================
   CERRAR MODAL
   ========================================================= */

function cerrar(){

  modal.classList.remove("on");

  edit = null;

}


/* =========================================================
   CERRAR MODAL HACIENDO CLICK AFUERA
   ========================================================= */

modal.addEventListener(
  "click",
  function(e){

    if(e.target === modal){

      cerrar();

    }

  }
);


/* =========================================================
   CAMBIO DE SESION
   ========================================================= */

db.auth.onAuthStateChange(
  async (event,session)=>{

    if(event === "SIGNED_OUT"){

      perfil = null;
      datos = [];

      mostrarLogin();

    }

  }
);


/* =========================================================
   INICIAR
   ========================================================= */

(async function iniciar(){

  try{

    const {
      data:{session}
    } =
      await db.auth.getSession();


    if(session){

      await cargarUsuario();

    }else{

      mostrarLogin();

    }

  }catch(error){

    console.error(
      "ERROR DE INICIO:",
      error
    );

    mostrarLogin();

    msg(
      "❌ No se pudo conectar con Supabase."
    );

  }

})();
